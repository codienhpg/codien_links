<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Vận hành khai thác</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            margin-top: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: #0066cc;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .link-btn:hover {
            background-color: #004fb3;
            transform: translateY(-2px);
        }
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .back-btn:hover {
            color: #000;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Danh Sách Liên Kết PVHKT</h1>
        
        <div class="link-list">
            <!-- Thay đổi tiêu đề và đường dẫn link theo ý muốn của bạn -->
            <a href="https://sites.google.com/view/phongvanhanhkhaithachpg/trang-ch%E1%BB%A7" class="link-btn" target="_blank">Phòng VHKT</a>
            <a href="https://example.com" class="link-btn" target="_blank">Tạo cuộc họp Zoom</a>
            <a href="https://example.com" class="link-btn" target="_blank">Báo cáo đầu việc</a>
        </div>

        <!-- Nút quay lại trang chủ -->
        <a href="index.html" class="back-btn">&larr; Quay lại trang chủ</a>
    </div>

</body>
</html>
